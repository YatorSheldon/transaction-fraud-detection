name: Deploy demo to Hugging Face Spaces

# Pushes the Gradio demo to https://huggingface.co/spaces/<HF_USERNAME>/fraudguard on every push to main.
# One-time setup: create the Space (SDK: Gradio), then add the repository secret HF_TOKEN
# (a Hugging Face write token) and the repository variable HF_USERNAME.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_USERNAME != ''
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space
        run: |
          mkdir space
          cp -r src app.py space/
          # The Space trains the model on first start (~1 minute), so it needs no model file or binaries.
          printf 'numpy>=1.26\npandas>=2.1\nscikit-learn>=1.4\nmatplotlib>=3.8\njoblib>=1.3\nfastapi>=0.110\n' > space/requirements.txt
          cat > space/README.md <<'MD'
          ---
          title: FraudGuard
          emoji: 💳
          colorFrom: blue
          colorTo: indigo
          sdk: gradio
          sdk_version: 6.30.0
          app_file: app.py
          pinned: false
          license: mit
          short_description: Card fraud detection with behavioural features
          ---

          Live demo of [FraudGuard](https://github.com/YatorSheldon/transaction-fraud-detection).
          The model trains on simulated transactions when the Space starts. See the GitHub repo for how it works.
          MD
          sed -i 's/^          //' space/README.md
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/fraudguard" main
