[project]
name = "fraudguard"
version = "0.1.0"
description = "Card transaction fraud detection: behavioural features, cost-aware thresholds and a real-time API."
authors = [{ name = "Yator Sheldon" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = ["C408"]  # dict(...) reads better for row records
